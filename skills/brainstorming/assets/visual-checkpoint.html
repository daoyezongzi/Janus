<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual checkpoint</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f4;
      --surface: #ffffff;
      --surface-alt: #e7ecea;
      --ink: #1d2528;
      --muted: #5d696d;
      --line: #c8d1ce;
      --accent: #14776f;
      --accent-soft: #dcefeb;
      --signal: #b64b3e;
      --shadow: 0 10px 28px rgba(29, 37, 40, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      font-weight: 720;
    }

    .lede {
      max-width: 690px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    output {
      min-width: 210px;
      padding: 10px 14px;
      border-left: 3px solid var(--signal);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .option {
      display: grid;
      grid-template-rows: 210px 1fr;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .option:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .option:focus-visible {
      outline: 3px solid rgba(20, 119, 111, 0.3);
      outline-offset: 3px;
    }

    .option[aria-pressed="true"] {
      border: 2px solid var(--accent);
      box-shadow: var(--shadow);
    }

    .preview {
      display: grid;
      gap: 8px;
      padding: 18px;
      overflow: hidden;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--line);
    }

    .preview-bar {
      height: 16px;
      border-radius: 3px;
      background: var(--ink);
      opacity: 0.88;
    }

    .preview-block {
      min-height: 32px;
      border: 1px solid rgba(29, 37, 40, 0.16);
      border-radius: 4px;
      background: var(--surface);
    }

    .focus-layout { grid-template-rows: 16px 1fr 38px; }
    .focus-layout .preview-block:nth-child(2) { width: 78%; justify-self: center; }

    .nav-layout {
      grid-template-columns: 76px 1fr;
      grid-template-rows: 16px 1fr;
    }

    .nav-layout .preview-bar { grid-column: 1 / -1; }
    .nav-layout .preview-block:nth-child(2) { background: #d4ddda; }

    .workspace-layout {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 16px 1fr 44px;
    }

    .workspace-layout .preview-bar,
    .workspace-layout .preview-block:last-child { grid-column: 1 / -1; }

    .option-copy { padding: 20px; }

    .option-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-bottom: 14px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
    }

    .option-title {
      display: block;
      margin-bottom: 8px;
      font-size: 1.08rem;
      line-height: 1.3;
    }

    .option-description {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    @media (max-width: 860px) {
      header { grid-template-columns: 1fr; align-items: start; }
      output { min-width: 0; }
      .options { grid-template-columns: 1fr; }
      .option { grid-template-columns: minmax(180px, 0.8fr) 1fr; grid-template-rows: 200px; }
      .preview { border-right: 1px solid var(--line); border-bottom: 0; }
    }

    @media (max-width: 560px) {
      main { width: min(100% - 24px, 1120px); padding-top: 28px; }
      .option { grid-template-columns: 1fr; grid-template-rows: 190px 1fr; }
      .preview { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (prefers-reduced-motion: reduce) {
      .option { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Visual checkpoint</p>
        <h1>Which layout best supports the primary task?</h1>
        <p class="lede">Compare focus, scanability, and the amount of context visible at once.</p>
      </div>
      <output id="selection" aria-live="polite">No direction selected</output>
    </header>

    <section class="options" aria-label="Layout directions">
      <button class="option" type="button" data-choice="A" data-title="Focused" aria-pressed="false">
        <span class="preview focus-layout" aria-hidden="true">
          <span class="preview-bar"></span><span class="preview-block"></span><span class="preview-block"></span>
        </span>
        <span class="option-copy">
          <span class="option-label">A</span><strong class="option-title">Focused</strong>
          <span class="option-description">A quiet single-task view with minimal competing context.</span>
        </span>
      </button>

      <button class="option" type="button" data-choice="B" data-title="Navigator" aria-pressed="false">
        <span class="preview nav-layout" aria-hidden="true">
          <span class="preview-bar"></span><span class="preview-block"></span><span class="preview-block"></span>
        </span>
        <span class="option-copy">
          <span class="option-label">B</span><strong class="option-title">Navigator</strong>
          <span class="option-description">Persistent navigation paired with a flexible primary workspace.</span>
        </span>
      </button>

      <button class="option" type="button" data-choice="C" data-title="Workspace" aria-pressed="false">
        <span class="preview workspace-layout" aria-hidden="true">
          <span class="preview-bar"></span><span class="preview-block"></span><span class="preview-block"></span><span class="preview-block"></span>
        </span>
        <span class="option-copy">
          <span class="option-label">C</span><strong class="option-title">Workspace</strong>
          <span class="option-description">A denser comparison surface for tasks that depend on parallel context.</span>
        </span>
      </button>
    </section>
  </main>

  <script>
    const options = Array.from(document.querySelectorAll('.option'));
    const selection = document.querySelector('#selection');
    options.forEach((option) => {
      option.addEventListener('click', () => {
        options.forEach((candidate) => candidate.setAttribute('aria-pressed', 'false'));
        option.setAttribute('aria-pressed', 'true');
        selection.textContent = 'Selected ' + option.dataset.choice + ' - ' + option.dataset.title;
      });
    });
  </script>
</body>
</html>
